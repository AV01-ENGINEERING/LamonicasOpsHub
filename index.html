<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SmartCalc v3.1</title>
<script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
<script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
<style>
:root{--accent:#ff9500;--bg:#000;--btn-bg:#1c1c1e;--btn-text:#fff;--btn-op:#ff9500;--btn-sec:#a6a6aa;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
 background:var(--bg);color:var(--btn-text);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#status{font-size:1rem;text-align:right;color:#aaa;padding-right:1.2rem;height:1.2rem;}
#rangeInfo{font-size:.9rem;text-align:right;color:#777;padding-right:1.2rem;height:1rem;}
#display{font-size:1.8rem;text-align:right;padding:1rem;border-bottom:1px solid #222;min-height:3rem;overflow-x:auto;}
#miniGraph{display:none;height:200px;width:100%;}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;padding:.8rem;}
.mathRow,.convertRow{display:none;grid-template-columns:repeat(4,1fr);gap:.6rem;padding:0 .8rem .8rem .8rem;transition:all .3s ease;}
button{border:none;border-radius:1.4rem;font-size:1.2rem;padding:1rem;background:var(--btn-bg);color:var(--btn-text);
 box-shadow:0 2px 3px rgba(255,255,255,.05);transition:.1s;}
button:active{transform:scale(.97);filter:brightness(1.3);}
.op{background:var(--btn-op);color:#fff;}
.sec{background:var(--btn-sec);color:#000;}
#mode{text-align:center;padding:.4rem;border-top:1px solid #222;font-size:.9rem;}
</style>
</head>
<body>
<div id="status"></div>
<div id="rangeInfo"></div>
<div id="display">0</div>
<div id="miniGraph"></div>

<div class="buttons">
 <button class="sec" onclick="clearDisplay()">AC</button>
 <button class="sec" onclick="delChar()">⌫</button>
 <button class="sec" onclick="append('(')">(</button>
 <button class="op" onclick="append(')')">)</button>

 <button onclick="append('7')">7</button>
 <button onclick="append('8')">8</button>
 <button onclick="append('9')">9</button>
 <button class="op" onclick="append('/')">÷</button>

 <button onclick="append('4')">4</button>
 <button onclick="append('5')">5</button>
 <button onclick="append('6')">6</button>
 <button class="op" onclick="append('*')">×</button>

 <button onclick="append('1')">1</button>
 <button onclick="append('2')">2</button>
 <button onclick="append('3')">3</button>
 <button class="op" onclick="append('-')">−</button>

 <button onclick="append('0')">0</button>
 <button onclick="append('.')">.</button>
 <button class="op" onclick="append('+')">+</button>
 <button class="op" onclick="calculate()">=</button>

 <button class="sec" onclick="toggleGraph()">Graph</button>
 <button class="sec" onclick="prepareDerivative()">d/dx</button>
 <button class="sec" onclick="prepareIntegral()">∫</button>
 <button class="sec" onclick="toggleMath()">Math ▲</button>
 <button class="sec" onclick="toggleConvert()">Convert ⇄</button>
</div>

<div class="mathRow" id="mathRow">
 <button onclick="append('x')">x</button>
 <button onclick="append('y')">y</button>
 <button onclick="append('^')">^</button>
 <button onclick="append('sqrt(')">√</button>
 <button onclick="append('pi')">π</button>
</div>

<div class="convertRow" id="convertRow">
 <button class="sec" onclick="convertUnit('ftm')">ft → m</button>
 <button class="sec" onclick="convertUnit('mft')">m → ft</button>
 <button class="sec" onclick="convertUnit('inmm')">in → mm</button>
 <button class="sec" onclick="convertUnit('mmin')">mm → in</button>
 <button class="sec" onclick="decimalToFraction()">Dec → Frac</button>
 <button class="sec" onclick="fractionToDecimal()">Frac → Dec</button>
</div>

<div id="mode">SmartCalc v3.1 — Engineered by A.V.</div>

<script>
let display=document.getElementById("display"),
 miniGraph=document.getElementById("miniGraph"),
 mathRow=document.getElementById("mathRow"),
 convertRow=document.getElementById("convertRow"),
 status=document.getElementById("status"),
 rangeInfo=document.getElementById("rangeInfo");
let mathOpen=false,convOpen=false,calcMode="normal",graphVisible=false;

function append(v){if(display.textContent==="0"||display.textContent==="Error")display.textContent=v;else display.textContent+=v;}
function clearDisplay(){display.textContent="0";status.textContent="";rangeInfo.textContent="";
 miniGraph.style.display="none";Plotly.purge(miniGraph);calcMode="normal";graphVisible=false;}
function delChar(){display.textContent=display.textContent.slice(0,-1)||"0";}
function toggleMath(){mathOpen=!mathOpen;convOpen=false;mathRow.style.display=mathOpen?"grid":"none";convertRow.style.display="none";}
function toggleConvert(){convOpen=!convOpen;mathOpen=false;convertRow.style.display=convOpen?"grid":"none";mathRow.style.display="none";}
function prepareDerivative(){calcMode="derivative";status.textContent="Derivative Mode";display.textContent="";}
function prepareIntegral(){calcMode="integral";status.textContent="Integral Mode";display.textContent="";}

function preprocess(expr){
 return expr
   .replace(/(\d)([a-zA-Z])/g,"$1*$2")
   .replace(/([a-zA-Z])(\d)/g,"$1^$2")
   .replace(/(\))(\()/g,"$1*(")
   .replace(/(\d|\))(\()/g,"$1*(")
   .replace(/\s+/g,"");
}

function calculate(){
 let expr=preprocess(display.textContent);
 if(!expr||expr==="0")return;
 try{
   if(calcMode==="derivative"){
     let diff=math.derivative(expr,"x");
     display.textContent=diff.toString();
     status.textContent="f(x) → f′(x)";
     calcMode="normal";return;
   }
   if(calcMode==="integral"){integrateExpression(expr);calcMode="normal";return;}
   display.textContent=math.format(math.evaluate(expr),{precision:14});
 }catch(e){display.textContent="Error";}
}

function integrateExpression(expr){
 try{
   if(expr.includes(",")){
     let parts=expr.split(",");
     let f=parts[0].replace(/[∫()]/g,"");
     let a=parseFloat(parts[1]);
     let b=parseFloat(parts[2]);
     let result=numericIntegral(f,a,b);
     display.textContent=`${result.toFixed(6)}`;
     status.textContent=`Definite Integral from ${a} to ${b}`;
     return;
   }
   if(expr.match(/(\d*)\*?x\^(\d+)/)){
     let match=expr.match(/(\d*)\*?x\^(\d+)/);
     let coef=match[1]?parseFloat(match[1]):1;
     let power=parseFloat(match[2]);
     let newCoef=(coef/(power+1)).toFixed(4);
     let newPower=(power+1);
     display.textContent=`(${newCoef})x^${newPower} + C`;
     status.textContent="∫(f(x))dx = F(x) + C";
     return;
   }
   if(expr.match(/(\d*)\*?x$/)){
     let match=expr.match(/(\d*)\*?x$/);
     let coef=match[1]?parseFloat(match[1]):1;
     let newCoef=(coef/2).toFixed(4);
     display.textContent=`(${newCoef})x^2 + C`;
     status.textContent="∫(f(x))dx = F(x) + C";
     return;
   }
   if(!isNaN(parseFloat(expr))){
     let num=parseFloat(expr);
     display.textContent=`(${num})x + C`;
     status.textContent="∫k dx = kx + C";
     return;
   }
   let val=numericIntegral(expr,-10,10);
   display.textContent="≈ "+val.toFixed(6);
   status.textContent="Approximate numeric integral (−10→10)";
 }catch(e){display.textContent="Error";status.textContent="Integration error";}
}

function numericIntegral(expr,a,b){
 const n=2000,dx=(b-a)/n;let area=0;
 for(let i=0;i<=n;i++){const x=a+i*dx;
   try{const y=math.evaluate(expr,{x});if(isFinite(y))area+=y*dx;}catch{}}
 return area;
}

// --- Decimal ↔ Fraction ---
function decimalToFraction(){
 try{
   let val=parseFloat(display.textContent);
   if(isNaN(val)){status.textContent="Enter a valid decimal";return;}
   let frac=math.fraction(val);
   display.textContent=`${frac.n}/${frac.d}`;
   status.textContent="Converted decimal → fraction";
 }catch{display.textContent="Error";}
}

function fractionToDecimal(){
 try{
   let expr=display.textContent.trim();
   if(!expr.includes("/")){status.textContent="Enter a fraction like 3/4";return;}
   let parts=expr.split("/");
   let val=parseFloat(parts[0])/parseFloat(parts[1]);
   display.textContent=val.toString();
   status.textContent="Converted fraction → decimal";
 }catch{display.textContent="Error";}
}

// --- Graphing ---
function toggleGraph(){
 let expr=preprocess(display.textContent);
 if(graphVisible){miniGraph.style.display="none";Plotly.purge(miniGraph);graphVisible=false;status.textContent="";rangeInfo.textContent="";return;}
 if(!expr||expr==="0")return;
 miniGraph.style.display="block";
 let xs=[],ys=[],start=-10,end=10,step=0.05;
 for(let x=start;x<=end;x+=step){try{let y=math.evaluate(expr,{x});if(isFinite(y)){xs.push(x);ys.push(y);}}catch{}}
 if(xs.length<2){status.textContent="Invalid function";return;}
 let yMin=Math.min(...ys),yMax=Math.max(...ys);
 let domText="[−∞, ∞]",ranText="[−∞, ∞]";
 if(expr.match(/1\/x|x\^(-1)/)) domText="(−∞, 0) ∪ (0, ∞)";
 if(expr.includes("sqrt(")) domText="[0, ∞)";
 if(expr.includes("log(")) domText="(0, ∞)";
 if(expr.includes("x^2")) ranText="[0, ∞)";
 if(expr.includes("x^3")||expr.includes("tan(")||expr.includes("sin(")||expr.includes("cos(")) ranText="(−∞, ∞)";
 if(expr.includes("e^x")) ranText="(0, ∞)";
 let slopeVal="N/A";try{let y1=ys[0],y2=ys[ys.length-1];slopeVal=((y2-y1)/(20)).toFixed(4);}catch{}
 Plotly.newPlot(miniGraph,[{x:xs,y:ys,type:"scatter",mode:"lines",line:{color:"#ff9500",width:2}}],
  {margin:{t:10,b:35,l:45,r:10},paper_bgcolor:"black",plot_bgcolor:"black",
   font:{color:"white"},
   xaxis:{gridcolor:"#333",zerolinecolor:"#777",title:"x"},
   yaxis:{gridcolor:"#333",zerolinecolor:"#777",title:"y"}},{staticPlot:true});
 status.textContent=`Graphing y = ${expr} | Overall Slope = ${slopeVal}`;
 rangeInfo.textContent=`Domain: ${domText} Range: ${ranText}`;
 graphVisible=true;
}

// --- Unit Conversion ---
function convertUnit(type){
 let val=parseFloat(display.textContent);
 if(isNaN(val)){status.textContent="Enter a number first";return;}
 let res=0,label="";
 switch(type){
   case"ftm":res=val*0.3048;label=`${val} ft = ${res.toFixed(4)} m`;break;
   case"mft":res=val/0.3048;label=`${val} m = ${res.toFixed(4)} ft`;break;
   case"inmm":res=val*25.4;label=`${val} in = ${res.toFixed(4)} mm`;break;
   case"mmin":res=val/25.4;label=`${val} mm = ${res.toFixed(4)} in`;break;
 }
 display.textContent=res.toFixed(6);
 status.textContent=label;
}
</script>
</body>
</html>
